name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The executable product-status audit puts the matrix at ~21-25 min on
    # runners. 35 keeps ten minutes of machine-variance headroom without
    # leaving a hung job unbounded.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Product-status fixtures archive immutable methodology foundation commit
      # 06954a3b4a1f3d20a13359618b307d5f6d1bbb9e.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + server + mcp + graph + test extras)
        run: python -m pip install -e ".[server,mcp,graph,test]"

      # The suite is offline by design: the mock engine drives extraction,
      # live-API paths are monkeypatched, and connectors are deny-by-default.
      - name: pytest
        env:
          PYTHONPATH: ""
          PYTEST_ADDOPTS: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -c /dev/null --rootdir .

      - name: Canonical product status
        env:
          PYTHONPATH: ""
          PYTEST_ADDOPTS: ""
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # `-P` per docs/PRODUCT_SPEC.md §7.1: without it `sys.path[0]` is `scripts/`,
        # so a `scripts/<stdlib-name>.py` is imported before the checker re-execs itself.
        run: python -P scripts/check_product_status.py --root . --document docs/PRODUCT_SPEC.md

      - name: Dashboard JS syntax check
        run: node --check ontologylab/web/app.js
