[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologylab"
version = "0.1.0"
description = "Local-first, single-user knowledge-graph pipeline: collect -> extract (LLM) -> verify (human) -> knowledge pack -> local MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ontologylab" }]
keywords = ["knowledge-graph", "ontology", "mcp", "local-first", "sqlite"]
# Core pipeline is standard-library only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27,<0.29", "httpx2>=2.0.0"]
# Optional local dashboard. The stdlib pipeline core never imports these.
server = ["fastapi", "uvicorn[standard]"]
# Optional MCP stdio server (FastMCP from the official python SDK).
mcp = ["mcp>=1.2,<2"]
# Optional tier-2 semantic embeddings (real model; one-time download).
embed = ["sentence-transformers>=3"]
# Optional Leiden community detection (Traag et al. 2019); falls back to
# stdlib label propagation when absent.
graph = ["python-igraph>=0.11", "leidenalg>=0.10"]
# Optional sqlite-vec KNN acceleration for tier-2 vector search (opt-in;
# falls back to brute-force cosine when absent).
vec = ["sqlite-vec>=0.1"]

[project.scripts]
ontologylab = "ontologylab.main:main"
ontologylab-serve = "ontologylab.serve:main"
ontologylab-mcp = "ontologylab.mcp_server:main"

[project.urls]
Homepage = "https://example.invalid/ontologylab"

[tool.setuptools]
packages = ["ontologylab", "ontologylab.connectors", "ontologylab.server", "ontologylab.web"]

[tool.setuptools.package-data]
ontologylab = ["*.json"]
"ontologylab.web" = ["*.html", "*.js", "*.css", "*.svg", "*.json", "fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
# tests/conftest.py does `from tests.factories import ...`, which needs the
# repo root on sys.path. The legacy setuptools editable install provided that
# as a side effect of its .pth; a modern editable (uv sync) exposes only the
# `ontologylab` package, so pytest must provide the root explicitly.
pythonpath = ["."]

# basedpyright (LSP) — the codebase parses untyped JSON by design and writes
# `Any` liberally, so the strict defaults drown real errors in style noise.
# Basic mode + the rules below keep argument/attribute/return-type errors
# visible (the signal) and silence the rest (the noise).
[tool.basedpyright]
typeCheckingMode = "basic"
reportExplicitAny = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportCallInDefaultInitializer = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportDeprecated = "none"
reportPrivateUsage = "none"
reportUnnecessaryComparison = "none"
